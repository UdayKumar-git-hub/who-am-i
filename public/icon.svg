<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#e2e8f0" stroke-width="6"/>

  <!-- Subtitle / Eyebrow -->
  <text x="256" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#d97706" text-anchor="middle" letter-spacing="7">TAIT PRESENTS</text>

  <!-- WHO in Navy -->
  <text x="256" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="115" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="-3">WHO</text>

  <!-- AM I? in Amber/Gold -->
  <text x="256" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" fill="#d97706" text-anchor="middle" letter-spacing="-2">AM I?</text>

  <!-- Subtle bottom accent line -->
  <rect x="196" y="425" width="120" height="8" rx="4" fill="#d97706"/>
</svg>
